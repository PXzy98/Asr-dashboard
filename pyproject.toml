[project]
name = "asr-dashboard"
version = "2.0.0"
description = "Desktop speech recognition: local Qwen3-ASR + speaker diarization + voiceprints + API engines"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
    # UI
    "PyQt6>=6.7",
    "PyQt6-Fluent-Widgets>=1.7",
    # ML core (qwen-asr itself lives in the default "qwen" dependency group, see below)
    "torch>=2.8",
    "torchaudio>=2.8",
    "pyannote.audio>=4.0,<5",
    "silero-vad>=5.1",
    "huggingface-hub>=0.28",
    # audio / numeric
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "PyAudioWPatch>=0.2.12.6; sys_platform == 'win32'",
    # network
    "httpx>=0.27",
    "websockets>=13",
    "jsonpath-ng>=1.6",
    # config / secrets
    "keyring>=25",
    "PyYAML>=6",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
vllm = ["qwen-asr[vllm]>=0.0.6; sys_platform == 'linux'"]
flash-attn = ["flash-attn>=2.6"]
dashscope = ["dashscope>=1.20"]
# PyTorch build selection (pick at most one): uv sync --extra cu128 / --extra rocm / --extra cpu
cpu = ["torch>=2.8", "torchaudio>=2.8"]
cu128 = ["torch>=2.8", "torchaudio>=2.8"]
rocm = ["torch>=2.8", "torchaudio>=2.8"]

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]
# Official qwen-asr package (pins transformers==4.57.x). Installed by default.
qwen = ["qwen-asr>=0.0.6"]
# Native Transformers support for the *-hf checkpoints needs transformers>=5.13,
# which conflicts with qwen-asr's pin, so it is a separate, mutually exclusive group:
#   uv sync --no-group qwen --group hf
hf = ["transformers>=5.13", "accelerate>=1.2"]

[project.scripts]
asr-dashboard = "asr_dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_dashboard"]

[tool.uv]
default-groups = ["dev", "qwen"]
conflicts = [
    [{ group = "qwen" }, { group = "hf" }],
    [{ extra = "cpu" }, { extra = "cu128" }, { extra = "rocm" }],
    [{ extra = "vllm" }, { group = "hf" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105", "SIM108", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a real GPU and downloaded models (skipped by default)",
    "network: needs internet access (skipped by default)",
]
addopts = "-m 'not gpu and not network'"
qt_api = "pyqt6"
